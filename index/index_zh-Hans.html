<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>清醒记账</title>
    <style>
        :root { color-scheme: light dark; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            line-height: 1.7;
            color: #000000;
            background: #ffffff;
        }
        .container {
            padding: 60px 24px calc(60px + env(safe-area-inset-bottom, 0px));
            text-align: center;
            min-height: 100vh;
        }
        h1 { font-size: 32px; font-weight: 700; margin-bottom: 12px; color: #000000; }
        .subtitle { font-size: 16px; color: rgba(0,0,0,0.5); margin-bottom: 48px; }
        .section { margin-bottom: 32px; }
        .section h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #000000; }
        .section p { font-size: 15px; color: rgba(0,0,0,0.55); max-width: 320px; margin: 0 auto; }
        a { color: #078A52; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
        footer { margin-top: 48px; font-size: 13px; color: rgba(0,0,0,0.3); }
        @media (prefers-color-scheme: dark) {
            body { color: #FAFAFA; background: #171717; }
            h1, .section h2 { color: #FAFAFA; }
            .subtitle, .section p { color: #898989; }
            footer { color: #5C5C5E; }
            a { color: #3ECF8E; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>清醒记账</h1>
        <p class="subtitle">AI语音记账，用最自然的方式记录每一笔收支。</p>

        <div class="section">
            <h2>技术支持</h2>
            <p>如有任何问题或建议，请在 App 内通过「帮助与反馈 → 联系我们」提交反馈，我们会尽快响应。</p>
        </div>

        <div class="section">
            <h2>隐私政策</h2>
            <p>我们使用了友盟移动统计 SDK 进行数据分析，收集的信息仅包括设备标识符和网络信息，不涉及个人敏感数据或你的记账内容。</p>
            <p><a href="https://calmledger.oss-cn-hangzhou.aliyuncs.com/privacy/privacy_zh-Hans">查看完整隐私政策 →</a></p>
        </div>

        <div class="section">
            <h2>服务条款</h2>
            <p><a href="https://calmledger.oss-cn-hangzhou.aliyuncs.com/terms/terms_zh-Hans">查看完整服务条款 →</a></p>
        </div>

        <footer>© 2026 CalmLedger. All rights reserved.</footer>
    </div>
</body>
</html>
