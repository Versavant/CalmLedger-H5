<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>清醒記帳</title>
    <style>
        :root { color-scheme: light dark; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            line-height: 1.7;
            color: #000000;
            background: #ffffff;
        }
        .container {
            padding: 60px 24px calc(60px + env(safe-area-inset-bottom, 0px));
            text-align: center;
            min-height: 100vh;
        }
        h1 { font-size: 32px; font-weight: 700; margin-bottom: 12px; color: #000000; }
        .subtitle { font-size: 16px; color: rgba(0,0,0,0.5); margin-bottom: 48px; }
        .section { margin-bottom: 32px; }
        .section h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #000000; }
        .section p { font-size: 15px; color: rgba(0,0,0,0.55); max-width: 320px; margin: 0 auto; }
        a { color: #078A52; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
        footer { margin-top: 48px; font-size: 13px; color: rgba(0,0,0,0.3); }
        @media (prefers-color-scheme: dark) {
            body { color: #FAFAFA; background: #171717; }
            h1, .section h2 { color: #FAFAFA; }
            .subtitle, .section p { color: #898989; }
            footer { color: #5C5C5E; }
            a { color: #3ECF8E; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>清醒記帳</h1>
        <p class="subtitle">AI語音記帳，用最自然的方式記錄每一筆收支。</p>

        <div class="section">
            <h2>技術支援</h2>
            <p>如有任何問題或建議，請在 App 內透過「幫助與回饋 → 聯絡我們」提交回饋，我們會盡快回應。</p>
        </div>

        <div class="section">
            <h2>隱私政策</h2>
            <p>我們使用了友盟行動統計 SDK 進行資料分析，收集的資訊僅包括裝置識別碼和網路資訊，不涉及個人敏感資料或你的記帳內容。</p>
            <p><a href="https://calmledger.oss-cn-hangzhou.aliyuncs.com/privacy/privacy_zh-Hant">查看完整隱私政策 →</a></p>
        </div>

        <div class="section">
            <h2>服務條款</h2>
            <p><a href="https://calmledger.oss-cn-hangzhou.aliyuncs.com/terms/terms_zh-Hant">查看完整服務條款 →</a></p>
        </div>

        <footer>© 2026 CalmLedger. All rights reserved.</footer>
    </div>
</body>
</html>
